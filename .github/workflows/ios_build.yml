name: iOS Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS
        run: |
          flutter build ios --simulator --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphonesimulator/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Runner.ipa
