name: alqanaa_app
description: "تطبيق القناعة - متجر جملة المواد الغذائية"
publish_to: 'none'
version: 1.0.0+50

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ═══════════════════════════
  #        Firebase & API
  # ═══════════════════════════
  firebase_core: ^3.10.1
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.10
  http: ^1.2.0
  googleapis_auth: ^2.3.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0 # ✅ نسخة مستقرة جداً
  url_launcher: ^6.3.0

  # ═══════════════════════════
  #        🖨️ الطباعة
  # ═══════════════════════════
  print_bluetooth_thermal: ^1.0.10
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1 # ✅ نسخة مستقرة لا تطلب أندرويد 37

  # ═══════════════════════════
  #     State Management
  # ═══════════════════════════
  flutter_riverpod: ^2.6.1

  # ═══════════════════════════
  #      UI & Animations
  # ═══════════════════════════
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_cropper: ^8.0.2
  badges: ^3.1.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

  # ═══════════════════════════
  #    Local Storage & Prefs
  # ═══════════════════════════
  shared_preferences: ^2.3.5

  # ═══════════════════════════
  #      Notifications
  # ═══════════════════════════
  flutter_local_notifications: ^17.2.3

  # ═══════════════════════════
  #       OCR & AI
  # ═══════════════════════════
  google_mlkit_text_recognition: ^0.14.0 # ✅ نسخة مستقرة جداً

  # ═══════════════════════════
  #       Media & Files
  # ═══════════════════════════
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # ═══════════════════════════
  #      PDF & Printing
  # ═══════════════════════════
  pdf: ^3.11.1
  printing: ^5.13.2

  # ═══════════════════════════
  #        Utilities
  # ═══════════════════════════
  intl: ^0.19.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  image: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/image.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image.png"
