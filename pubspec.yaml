name: alqanaa_app
description: "تطبيق القناعة - متجر جملة المواد الغذائية"
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ═══════════════════════════
  #        Firebase & API
  # ═══════════════════════════
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  http: ^1.2.0
  googleapis_auth: ^2.3.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.0

  # ═══════════════════════════
  #        🖨️ الطباعة
  # ═══════════════════════════
  # ✅ بديل حديث بدون تعارض أنواع
  print_bluetooth_thermal: ^1.0.10
  # ✅ بديل esc_pos_utils الحديث
  esc_pos_utils_plus: ^2.0.4
  # ✅ الأذونات
  permission_handler: ^11.0.0

  # ═══════════════════════════
  #     State Management
  # ═══════════════════════════
  flutter_riverpod: ^3.3.2

  # ═══════════════════════════
  #      UI & Animations
  # ═══════════════════════════
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_cropper: ^12.2.1
  badges: ^3.1.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  google_fonts: ^8.1.0

  # ═══════════════════════════
  #    Local Storage & Prefs
  # ═══════════════════════════
  shared_preferences: ^2.2.2

  # ═══════════════════════════
  #      Notifications
  # ═══════════════════════════
  flutter_local_notifications: ^22.0.0

  # ═══════════════════════════
  #       Media & Files
  # ═══════════════════════════
  image_picker: ^1.0.7
  path_provider: ^2.1.2

  # ═══════════════════════════
  #      PDF & Printing
  # ═══════════════════════════
  pdf: ^3.10.8
  printing: ^5.12.0

  # ═══════════════════════════
  #        Utilities
  # ═══════════════════════════
  intl: ^0.20.2
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ═══════════════════════════
#    ✅ حل تعارض المكتبات
# ═══════════════════════════
dependency_overrides:
  image: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/image.png

# ═══════════════════════════
#     إعدادات أيقونة التطبيق
# ═══════════════════════════
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image.png"